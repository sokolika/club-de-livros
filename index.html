<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5eddf">
<title>Clube de Livros</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5eddf;--paper:#fffaf2;--ink:#443326;--muted:#817565;--orange:#d87832;--green:#526a3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
header{max-width:560px;margin:auto;padding:15px 17px;display:flex;align-items:center;justify-content:space-between}
.brand{font:700 18px Georgia,serif;letter-spacing:1px;color:var(--green)}
button{font:inherit;cursor:pointer}.lang{border:1px solid #d8cbb7;border-radius:20px;background:transparent;color:var(--ink);padding:7px 11px}
main{max-width:560px;margin:auto;padding:0 15px 92px}
.hero{background:#eee2cf;border-radius:22px;padding:14px 14px 18px;text-align:center}
.mascot{display:block;width:100%;height:auto;max-height:245px;object-fit:contain;border-radius:13px}
h1{font:700 24px Georgia,serif;margin:16px 0 7px}
.intro{font-size:14px;line-height:1.5;color:var(--muted);max-width:370px;margin:0 auto 17px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{border:0;border-radius:16px;min-height:112px;padding:15px;text-align:left;color:white}
.tile .symbol{font-size:22px}.tile strong{display:block;font:700 21px Georgia,serif;margin-top:10px}.tile small{display:block;margin-top:5px}
.shop{background:var(--orange)}.library{background:var(--green)}
.panel{background:var(--paper);border-radius:20px;padding:19px 17px;min-height:290px}
.back{background:#eee2cf;border:0;border-radius:10px;padding:8px 12px;color:var(--ink)}
h2{font:700 26px Georgia,serif;margin:20px 0 5px}.sub{color:var(--muted);font-size:14px;margin:0}
.empty{margin-top:22px;border:1px dashed #d7c9b3;border-radius:15px;padding:27px 14px;text-align:center}
.empty .emoji{font-size:34px}.empty b{display:block;margin:9px 0 6px}.empty p{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.profile-row{padding:14px 2px;border-bottom:1px solid #eadfce;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffaf2;border-top:1px solid #e5dac9;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#857969;font-size:11px;min-width:65px}nav button.active{color:#a75d2c;font-weight:700}nav .ico{display:block;font-size:19px;margin-bottom:2px}
</style></head>
<body>
<header><div class="brand">CLUBE DE LIVROS</div><button class="lang" id="lang">PT</button></header>
<main id="app"></main>
<nav>
<button data-page="home" class="active"><span class="ico">⌂</span><span data-label="home">Главная</span></button>
<button data-page="shop"><span class="ico">▣</span><span data-label="shop">Магазин</span></button>
<button data-page="library"><span class="ico">▤</span><span data-label="library">Библиотека</span></button>
<button data-page="profile"><span class="ico">♙</span><span data-label="profile">Профиль</span></button>
</nav>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
let lang='ru',page='home';
const T={
ru:{home:'Главная',shop:'Магазин',library:'Библиотека',profile:'Профиль',headline:'Книги для больших и маленьких читателей',intro:'Покупайте книги или пользуйтесь библиотекой по подписке.',shopHint:'Купить книги →',libHint:'По подписке →',shopSub:'Книги для покупки',shopEmpty:'Каталог пока пуст',shopDesc:'Здесь появятся книги разных жанров и для разных возрастов.',libSub:'Доступ по подписке',libEmpty:'Библиотека готовится',libDesc:'Здесь появятся каталог библиотеки и условия подписки.',profileSub:'Профиль будет связан с вашим Telegram-аккаунтом.',profileEmpty:'Данные понадобятся только при оформлении покупки или подписки.',orders:'Мои заказы',subscription:'Моя подписка',contacts:'Контакты',back:'← Главная'},
pt:{home:'Início',shop:'Loja',library:'Biblioteca',profile:'Perfil',headline:'Livros para leitores de todas as idades',intro:'Compre livros ou utilize a biblioteca por subscrição.',shopHint:'Comprar livros →',libHint:'Por subscrição →',shopSub:'Livros para comprar',shopEmpty:'O catálogo ainda está vazio',shopDesc:'Aqui encontrará livros de vários géneros e para diferentes idades.',libSub:'Acesso por subscrição',libEmpty:'A biblioteca está a ser preparada',libDesc:'Aqui estarão o catálogo e as condições da subscrição.',profileSub:'O perfil ficará associado à sua conta Telegram.',profileEmpty:'Os dados só serão pedidos ao fazer uma compra ou subscrição.',orders:'As minhas encomendas',subscription:'A minha subscrição',contacts:'Contactos',back:'← Início'}
};
function render(){
 const t=T[lang],app=document.getElementById('app');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 document.querySelectorAll('[data-label]').forEach(el=>el.textContent=t[el.dataset.label]);
 if(page==='home')app.innerHTML=`<section class="hero"><img class="mascot" src="assets/mascot.jpg" alt="Mascote original Clube de Livros"><h1>${t.headline}</h1><p class="intro">${t.intro}</p><div class="tiles"><button class="tile shop" data-go="shop"><span class="symbol">▣</span><strong>${t.shop}</strong><small>${t.shopHint}</small></button><button class="tile library" data-go="library"><span class="symbol">▤</span><strong>${t.library}</strong><small>${t.libHint}</small></button></div></section>`;
 if(page==='shop')app.innerHTML=`<section class="panel"><button class="back" data-go="home">${t.back}</button><h2>${t.shop}</h2><p class="sub">${t.shopSub}</p><div class="empty"><div class="emoji">📚</div><b>${t.shopEmpty}</b><p>${t.shopDesc}</p></div></section>`;
 if(page==='library')app.innerHTML=`<section class="panel"><button class="back" data-go="home">${t.back}</button><h2>${t.library}</h2><p class="sub">${t.libSub}</p><div class="empty"><div class="emoji">📖</div><b>${t.libEmpty}</b><p>${t.libDesc}</p></div></section>`;
 if(page==='profile')app.innerHTML=`<section class="panel"><h2>${t.profile}</h2><p class="sub">${t.profileSub}</p><div class="empty"><div class="emoji">♙</div><p>${t.profileEmpty}</p></div><div class="profile-row">${t.orders}</div><div class="profile-row">${t.subscription}</div><div class="profile-row">${t.contacts}</div></section>`;
}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]'),g=e.target.closest('[data-go]');if(p){page=p.dataset.page;render()}if(g){page=g.dataset.go;render()}});
document.getElementById('lang').onclick=()=>{lang=lang==='ru'?'pt':'ru';document.getElementById('lang').textContent=lang==='ru'?'PT':'RU';render()};
render();
</script></body></html>
